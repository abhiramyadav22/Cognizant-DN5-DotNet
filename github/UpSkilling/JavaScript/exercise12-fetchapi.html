<!DOCTYPE html>
<html>

<head>
    <title>Fetch API</title>
</head>

<body>

    <button onclick="sendData()">
        Register
    </button>

    <p id="msg"></p>

    <script>

        function sendData(){

            document.getElementById("msg").innerHTML =
            "Sending...";

            setTimeout(function(){

                fetch("https://jsonplaceholder.typicode.com/posts",{

                    method:"POST"

                })

                .then(function(){

                    document.getElementById("msg").innerHTML =
                    "Success";

                });

            },2000);

        }

    </script>

</body>

</html>
