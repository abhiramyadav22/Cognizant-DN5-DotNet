<!DOCTYPE html>
<html>

<head>
    <title>Conditionals</title>
</head>

<body>

    <script>

        let seats = 10;

        if(seats > 0){

            console.log("Registration Open");

        }
        else{

            console.log("Event Full");

        }

        let events = ["Music","Sports","Workshop"];

        events.forEach(function(e){

            console.log(e);

        });

        try{

            console.log(events[0]);

        }
        catch(err){

            console.log(err);

        }

    </script>

</body>

</html>
