<!DOCTYPE html>
<html>

<head>

    <title>jQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <button id="registerBtn">
        Show Event
    </button>

    <div id="card">

        Music Event

    </div>

    <script>

        $("#registerBtn").click(function(){

            $("#card").fadeOut();

            $("#card").fadeIn();

        });

    </script>

</body>

</html>
