<!DOCTYPE html>
<html>

<head>
    <title>DOM</title>
</head>

<body>

    <div id="events"></div>

    <button onclick="addEvent()">
        Add Event
    </button>

    <script>

        function addEvent(){

            let card =
            document.createElement("p");

            card.innerHTML =
            "Music Event";

            document
            .querySelector("#events")
            .appendChild(card);

        }

    </script>

</body>

</html>
