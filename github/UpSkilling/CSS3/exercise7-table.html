<!DOCTYPE html>
<html>

<head>

    <title>Table Styling</title>

    <style>

        table{
            border-collapse:collapse;
            width:50%;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        tr:nth-child(even){
            background-color:lightgray;
        }

    </style>

</head>

<body>

    <h2>Event Table</h2>

    <table>

        <tr>

            <th>Event</th>
            <th>City</th>

        </tr>

        <tr>

            <td>Music</td>
            <td>Hyderabad</td>

        </tr>

        <tr>

            <td>Sports</td>
            <td>Mumbai</td>

        </tr>

    </table>

</body>

</html>
