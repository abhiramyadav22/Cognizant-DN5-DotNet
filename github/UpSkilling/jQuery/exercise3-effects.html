<!DOCTYPE html>
<html>

<head>

    <title>Effects</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <div id="card">

        Music Event

    </div>

    <br>

    <button id="hide">
        Hide
    </button>

    <script>

        $("#hide").click(function(){

            $("#card").fadeOut();

        });

    </script>

</body>

</html>
