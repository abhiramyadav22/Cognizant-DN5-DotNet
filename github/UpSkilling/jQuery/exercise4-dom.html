<!DOCTYPE html>
<html>

<head>

    <title>DOM</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <div id="events">

    </div>

    <button id="add">
        Add Event
    </button>

    <script>

        $("#add").click(function(){

            $("#events").append("<p>Workshop Event</p>");

        });

    </script>

</body>

</html>
