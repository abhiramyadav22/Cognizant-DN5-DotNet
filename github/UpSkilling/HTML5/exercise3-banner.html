<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>

        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div id="welcomeBanner">
        Welcome to Community Event Portal
    </div>

    <br>

    <p class="highlight">
        New event registrations are open now.
    </p>

    <p>
        Special Offer:
        <span style="color:red; font-weight:bold;">
            50% Discount
        </span>
        for students.
    </p>

</body>

</html>
