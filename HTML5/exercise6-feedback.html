<!DOCTYPE html>
<html>

<head>

    <title>Feedback Form</title>

</head>

<body>

    <h2>Event Feedback</h2>

    Phone Number:<br>

    <input type="text"
    id="phone"
    onblur="checkPhone()">

    <p id="msg"></p>

    <br>

    Select Event:<br>

    <select onchange="showFee()" id="event">

        <option value="100">Music</option>
        <option value="200">Sports</option>

    </select>

    <p id="fee"></p>

    <button onclick="showAlert()">
        Submit
    </button>

    <br><br>

    <img src="https://via.placeholder.com/150"
    ondblclick="bigImage(this)">

    <br><br>

    <textarea id="text"
    onkeyup="countText()"></textarea>

    <p id="count"></p>

    <script>

        function checkPhone(){

            let p =
            document.getElementById("phone").value;

            if(p.length == 10){

                document.getElementById("msg").innerHTML =
                "Valid Number";

            }
            else{

                document.getElementById("msg").innerHTML =
                "Invalid Number";

            }

        }

        function showFee(){

            let f =
            document.getElementById("event").value;

            document.getElementById("fee").innerHTML =
            "Fee is " + f;

        }

        function showAlert(){

            alert("Submitted");

        }

        function bigImage(img){

            img.style.width = "300px";

        }

        function countText(){

            let t =
            document.getElementById("text").value;

            document.getElementById("count").innerHTML =
            t.length;

        }

    </script>

</body>

</html>
