<!DOCTYPE html>
<html>

<head>

    <title>Links and Lists</title>

    <style>

        a:link{
            color:blue;
        }

        a:hover{
            color:red;
        }

        a:active{
            color:green;
        }

        ul{
            list-style-type:square;
        }

        li{
            padding:5px;
            margin:5px;
        }

    </style>

</head>

<body>

    <h2>Community Links</h2>

    <a href="#">
        Home
    </a>

    <br><br>

    <ul>

        <li>Music Event</li>
        <li>Sports Event</li>
        <li>Workshop</li>

    </ul>

</body>

</html>
