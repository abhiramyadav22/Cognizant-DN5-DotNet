<!DOCTYPE html>
<html>

<head>

    <title>Columns</title>

    <style>

        .news{

            column-count:2;
            column-gap:30px;
            column-rule:1px solid gray;

        }

    </style>

</head>

<body>

    <h2>Community News</h2>

    <div class="news">

        Community events are happening in many cities.
        Students and families can participate in workshops,
        sports events and music programs. Many activities
        are arranged for public awareness and learning.

    </div>

</body>

</html>
