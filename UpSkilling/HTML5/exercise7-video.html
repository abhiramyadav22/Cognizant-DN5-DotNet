<!DOCTYPE html>
<html>

<head>

    <title>Video Invite</title>

</head>

<body>

    <h2>Event Promo Video</h2>

    <video width="300"
    controls
    oncanplay="videoReady()">

        <source src="movie.mp4" type="video/mp4">

    </video>

    <p id="msg"></p>

    <script>

        function videoReady(){

            document.getElementById("msg").innerHTML =
            "Video ready to play";

        }

        window.onbeforeunload = function(){

            return "Form is not completed";

        }

    </script>

</body>

</html>
