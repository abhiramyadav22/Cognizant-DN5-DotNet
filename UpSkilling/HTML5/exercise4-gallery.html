<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>

    <style>

        .eventImage {
            border: 2px solid black;
            width: 150px;
            height: 100px;
        }

        table {
            margin: auto;
        }

        td {
            padding: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

    <h2 align="center">Community Event Gallery</h2>

    <table border="1">

        <tr>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Music Event"
                     title="Music Event"
                     class="eventImage">

                <p>Music Event</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Food Festival"
                     title="Food Festival"
                     class="eventImage">

                <p>Food Festival</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Sports Event"
                     title="Sports Event"
                     class="eventImage">

                <p>Sports Event</p>
            </td>

        </tr>

        <tr>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Workshop"
                     title="Workshop"
                     class="eventImage">

                <p>Workshop</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Dance Event"
                     title="Dance Event"
                     class="eventImage">

                <p>Dance Event</p>
            </td>

            <td>
                <img src="https://via.placeholder.com/150"
                     alt="Seminar"
                     title="Seminar"
                     class="eventImage">

                <p>Seminar</p>
            </td>

        </tr>

    </table>

</body>

</html>
