<!DOCTYPE html>
<html>

<head>
    <title>Async JS</title>
</head>

<body>

    <script>

        fetch("https://jsonplaceholder.typicode.com/users")

        .then(function(res){

            return res.json();

        })

        .then(function(data){

            console.log(data);

        })

        .catch(function(){

            console.log("Error");

        });

    </script>

</body>

</html>
