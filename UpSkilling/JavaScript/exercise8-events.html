<!DOCTYPE html>
<html>

<head>
    <title>Events</title>
</head>

<body>

    <button onclick="register()">
        Register
    </button>

    <br><br>

    <select onchange="showEvent()"
    id="event">

        <option>Music</option>
        <option>Sports</option>

    </select>

    <br><br>

    <input type="text"
    onkeydown="search()">

    <script>

        function register(){

            alert("Registered");

        }

        function showEvent(){

            let e =
            document.getElementById("event").value;

            console.log(e);

        }

        function search(){

            console.log("Searching");

        }

    </script>

</body>

</html>
