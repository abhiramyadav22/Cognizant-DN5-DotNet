<!DOCTYPE html>
<html>

<head>
    <title>Arrays</title>
</head>

<body>

    <script>

        let events = ["Music","Sports"];

        events.push("Workshop");

        console.log(events);

        let music = events.filter(function(e){

            return e == "Music";

        });

        console.log(music);

        let list = events.map(function(e){

            return "Event : " + e;

        });

        console.log(list);

    </script>

</body>

</html>
