<!DOCTYPE html>
<html>

<head>

    <title>Selectors</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <p id="msg">
        Welcome
    </p>

    <button id="btn">
        Change Text
    </button>

    <script>

        $("#btn").click(function(){

            $("#msg").text("Event Registered");

        });

    </script>

</body>

</html>
